<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
</head>
<body>
    <h1>按钮测试</h1>
    <button onclick="testFunction()">测试按钮</button>
    <div id="result"></div>
    
    <script>
        function testFunction() {
            document.getElementById('result').innerHTML = '<p style="color:green;">按钮工作正常!</p>';
        }
        
        // 测试 switchTab 函数
        function switchTab(tab, element) {
            console.log('switchTab called:', tab);
            element.style.backgroundColor = 'yellow';
            setTimeout(() => {
                element.style.backgroundColor = '';
            }, 500);
        }
    </script>
    
    <h2>Tab 测试</h2>
    <button onclick="switchTab('test1', this)">Tab 1</button>
    <button onclick="switchTab('test2', this)">Tab 2</button>
    <button onclick="switchTab('test3', this)">Tab 3</button>
</body>
</html>
