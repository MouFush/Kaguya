version: '3.8'

services:
  # FastAPI应用
  api:
    build: .
    container_name: kaguya_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/kaguya_ai.db
      - REDIS_URL=redis://redis:6379/0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - kaguya_network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: kaguya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kaguya_network

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: kaguya_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - kaguya_network

volumes:
  redis_data:

networks:
  kaguya_network:
    driver: bridge
