<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaguya IDE</title>
  <script src="/static/js/kaguya-file-upload.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", Arial, sans-serif; background: #0f1117; color: #e8eaf2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #262b36; background: #151924; }
    h1 { font-size: 16px; margin: 0; letter-spacing: 0; }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
    aside { border-right: 1px solid #262b36; background: #121621; min-height: 0; display: flex; flex-direction: column; }
    .toolbar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid #262b36; flex-wrap: wrap; }
    button { border: 1px solid #343b4a; background: #202637; color: #f1f3f8; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: 12px; }
    button:hover { background: #293248; }
    input[type="file"] { display: none; }
    .tree { padding: 8px; overflow: auto; flex: 1; }
    .node { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 7px; align-items: center; font-size: 12px; color: #d9ddea; }
    .node:hover { background: #202637; }
    .content { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
    .status { padding: 10px 14px; border-bottom: 1px solid #262b36; color: #9ea7ba; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    pre { margin: 0; padding: 16px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 Consolas, "Cascadia Mono", monospace; }
    .empty { color: #8c94a8; padding: 24px; }
    .danger { color: #ff8b8b; }
    .ok { color: #7ee2a8; }
  </style>
</head>
<body>
  <header>
    <h1>Kaguya IDE</h1>
    <button id="refreshBtn" type="button">Refresh</button>
  </header>
  <main>
    <aside>
      <div class="toolbar">
        <button id="uploadBtn" type="button">Upload Files</button>
        <button id="uploadDirBtn" type="button">Upload Folder</button>
        <input id="fileInput" type="file" multiple>
        <input id="dirInput" type="file" multiple webkitdirectory>
      </div>
      <div id="tree" class="tree"></div>
    </aside>
    <section class="content">
      <div id="status" class="status">Loading workspace...</div>
      <pre id="viewer" class="empty">Select a file to preview it.</pre>
    </section>
  </main>
  <script>
    const state = { root: '', path: '' };
    const tree = document.getElementById('tree');
    const statusEl = document.getElementById('status');
    const viewer = document.getElementById('viewer');

    function setStatus(text, kind) {
      statusEl.className = 'status ' + (kind || '');
      statusEl.textContent = text;
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(ch) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
      });
    }

    async function json(url, options) {
      const response = await fetch(url, options || {});
      const body = await response.json().catch(function() { return {}; });
      if (!response.ok || body.success === false) {
        throw new Error(body.message || body.error || response.statusText);
      }
      return body;
    }

    function joinPath(base, name) {
      if (!base) return name;
      return base.replace(/[\\/]+$/, '') + '/' + name;
    }

    async function loadTree(path) {
      const payload = { workspace: state.root || undefined, path: path || undefined };
      const data = await json('/agent/file-tree', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      state.root = data.root || state.root;
      state.path = data.path || '';
      renderTree(data.entries || []);
      setStatus('Workspace: ' + (state.root || '(default)') + (state.path ? ' / ' + state.path : ''), 'ok');
    }

    function renderTree(entries) {
      tree.innerHTML = '';
      if (state.path) {
        const up = document.createElement('div');
        up.className = 'node';
        up.innerHTML = '<span>..</span><span>Parent</span>';
        up.onclick = function() {
          const parts = state.path.split('/').filter(Boolean);
          parts.pop();
          loadTree(parts.join('/')).catch(showError);
        };
        tree.appendChild(up);
      }
      if (!entries.length) {
        tree.innerHTML += '<div class="empty">No files in this folder.</div>';
      }
      entries.forEach(function(entry) {
        const node = document.createElement('div');
        node.className = 'node';
        node.innerHTML = '<span>' + (entry.is_dir ? 'DIR' : 'FILE') + '</span><span>' + escapeHtml(entry.name) + '</span>';
        node.onclick = function() {
          if (entry.is_dir) loadTree(entry.path).catch(showError);
          else readFile(entry.path).catch(showError);
        };
        tree.appendChild(node);
      });
    }

    async function readFile(path) {
      const data = await json('/agent/read-file', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ workspace: state.root, path: path }),
      });
      viewer.className = '';
      viewer.textContent = data.content || '';
      setStatus('Opened: ' + path, 'ok');
    }

    async function uploadFiles(files) {
      const list = Array.from(files || []);
      if (!list.length) return;
      if (!window.KaguyaUpload) throw new Error('upload helper unavailable');
      const paths = list.map(function(file) {
        return joinPath(state.path, file.webkitRelativePath || file.name);
      });
      setStatus('Uploading ' + list.length + ' file(s)...');
      const result = await window.KaguyaUpload.uploadFiles('/agent/upload-device-files', list, {
        fieldName: 'files',
        maxFiles: 50,
        extraFields: { workspace: state.root, paths: paths },
        onProgress: function(info) {
          setStatus('Uploading batch ' + info.batch + '/' + info.totalBatches + '...');
        },
      });
      if (result.success === false) {
        throw new Error(window.KaguyaUpload.summarizeError(result));
      }
      setStatus('Uploaded ' + result.files + ' file(s).', 'ok');
      await loadTree(state.path);
    }

    function showError(error) {
      setStatus(error.message || String(error), 'danger');
    }

    document.getElementById('refreshBtn').onclick = function() { loadTree(state.path).catch(showError); };
    document.getElementById('uploadBtn').onclick = function() { document.getElementById('fileInput').click(); };
    document.getElementById('uploadDirBtn').onclick = function() { document.getElementById('dirInput').click(); };
    document.getElementById('fileInput').onchange = function(event) { uploadFiles(event.target.files).catch(showError); event.target.value = ''; };
    document.getElementById('dirInput').onchange = function(event) { uploadFiles(event.target.files).catch(showError); event.target.value = ''; };

    loadTree('').catch(showError);
  </script>
</body>
</html>
