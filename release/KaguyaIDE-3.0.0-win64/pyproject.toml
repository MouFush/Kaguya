[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaguya-ide"
version = "3.0.0"
description = "Kaguya IDE - AI-powered coding assistant with autonomous agent capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Kaguya Team", email = "kaguya-ide@example.com"},
]
keywords = ["ai", "ide", "coding-assistant", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: IDE",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "flask>=2.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
full = [
    "flask>=2.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyinstaller>=5.13.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
kaguya-ide = "start_server:main"

[project.urls]
Homepage = "https://github.com/kaguya-ide/kaguya-ide"
Repository = "https://github.com/kaguya-ide/kaguya-ide"
Documentation = "https://kaguya-ide.readthedocs.io"

[tool.setuptools.packages.find]
include = [
    "kaguya_core*",
    "kaguya_*",
    "ollama_adapter*",
    "qwen3_web*",
    "start_server*",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.db", "*.png", "*.jpg"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 120
target-version = "py39"
